<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>바다 사나이 · 공유받은 포인트</title>
  <!-- 공유 링크는 개인 위치 정보라 검색에 잡히지 않게 한다. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p class="brand">바다 사나이</p>

    <!-- 처음에는 숨겨 두고 viewer.js가 상태에 맞는 하나만 보여 준다. -->
    <section id="loading" class="card">불러오는 중…</section>

    <section id="error" class="card error" hidden>
      <h1>링크를 열 수 없어요</h1>
      <p id="error-message"></p>
      <p class="hint">보낸 분께 링크를 다시 보내 달라고 부탁해 보세요.</p>
    </section>

    <section id="point" class="card" hidden>
      <p id="genre" class="genre" hidden></p>
      <h1 id="name"></h1>
      <p id="coords" class="coords"></p>
      <p id="memo" class="memo" hidden></p>

      <div class="actions">
        <a id="google" class="btn primary" target="_blank" rel="noopener noreferrer">구글 지도에서 보기</a>
        <a id="kakao" class="btn" target="_blank" rel="noopener noreferrer">카카오맵에서 보기</a>
        <a id="kakao-route" class="btn" target="_blank" rel="noopener noreferrer">카카오맵 길찾기</a>
        <button id="copy" class="btn" type="button">좌표 복사</button>
      </div>
    </section>

    <section id="app" class="card app" hidden>
      <h2>앱에서 열면 내 포인트로 저장할 수 있어요</h2>
      <p>바다 사나이 앱이 있다면 이 링크를 앱에서 열어 보세요.</p>
      <p class="hint">앱은 출시 준비 중이에요.</p>
    </section>
  </main>
  <script type="module" src="viewer.js"></script>
</body>
</html>
