name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

# 같은 브랜치에서 새로 푸시하면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - run: flutter pub get

      # Drift 생성 코드(app_database.g.dart)가 테이블 정의와 맞는지 확인한다.
      # 테이블을 고치고 build_runner를 돌리지 않은 채 커밋하면 여기서 실패한다.
      - name: 생성 코드 최신 여부
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/core/db/app_database.g.dart

      # 출시한 DB 모양(drift_schemas/)이 코드와 어긋났는지 확인한다. 테이블을 바꾸고 schemaVersion과
      # 스냅샷·마이그레이션 단계를 갱신하지 않으면 여기서 실패해, 사용자 기록이 업데이트로 날아가는 것을 막는다.
      # 갱신 방법은 test/migration_test.dart의 주석에 있다.
      - name: DB 스키마 스냅샷 최신 여부
        run: |
          dart run drift_dev schema dump lib/core/db/app_database.dart drift_schemas/
          dart run drift_dev schema steps drift_schemas/ lib/core/db/schema_versions.dart
          dart run drift_dev schema generate drift_schemas/ test/generated_migrations/
          test -z "$(git status --porcelain -- drift_schemas lib/core/db/schema_versions.dart test/generated_migrations)" || {
            git status --porcelain -- drift_schemas lib/core/db/schema_versions.dart test/generated_migrations
            echo "DB 스키마 스냅샷이 코드와 다릅니다. test/migration_test.dart의 안내대로 갱신해 커밋하세요."
            exit 1
          }

      - run: flutter analyze

      # SQLite가 필요한 저장소 테스트와 위젯 테스트까지 모두 돈다.
      # 결과를 JSON 파일로도 남겨, 실패하면 아래 단계가 실패한 테스트를 주석으로 요약한다.
      - name: flutter test
        run: flutter test --file-reporter json:test_report.json

      # 로그를 내려받지 않아도 실패한 테스트의 이름과 오류를 볼 수 있게 한다(주석은 공개 API로 읽힌다).
      - name: 실패한 테스트 요약
        if: failure()
        run: python3 tool/ci_annotate_tests.py test_report.json

  # 앱이 없는 사람이 보는 정적 웹 뷰어(web_viewer)의 해독 로직 테스트.
  web-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
        working-directory: web_viewer
